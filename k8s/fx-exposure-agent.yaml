apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-exposure-agent
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fx-exposure-agent
  template:
    metadata:
      labels:
        app: fx-exposure-agent
    spec:
      containers:
        - name: fx-exposure-agent
          image: fx-exposure-agent:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 10001
          envFrom:
            - configMapRef:
                name: agents-config
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini
                  key: GOOGLE_API_KEY
            - name: A2A_PUBLIC_URL
              value: http://localhost:10001/a2a/
          readinessProbe:
            tcpSocket:
              port: 10001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 10001
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fx-exposure-agent
  namespace: agents
spec:
  selector:
    app: fx-exposure-agent
  ports:
    - port: 10001
      targetPort: 10001
