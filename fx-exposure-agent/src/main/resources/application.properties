spring.application.name=fx-exposure-agent
server.port=10001
server.servlet.context-path=/a2a
spring.ai.a2a.server.enabled=true

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
